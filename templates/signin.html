<!DOCTYPE html>
<html>
    <head>
        <title>To Do</title>
        <link rel="stylesheet" href="{{url_for('static',filename='signin.css')}}">
    </head>
    <body>
        <div class="container">

            <form method="POST">
            <table>
                <tr>
                <td>
                <label for="username">Username :</label></td>
                <td><input type="text" id="username" placeholder="Enter your name here"><br></td>
            </tr>

            <tr>
                <td><label for="email">Email :</label></td>
                <td><input type="email" id="email" placeholder="Enter your email"></td><br>
                
            <tr>
                <td><label for="password">Password :</label></td>
                <td><input type="password" id="password" placeholder="Enter your password"></td><br>
                </tr>
            <tr><td colspan="2" style="text-align: center;"><button>Sign in</button></td></tr>
            </table>
            </form>
        </div>
    </body>
</html>
